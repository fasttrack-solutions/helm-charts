apiVersion: v2
name: ft-service
description: >-
  Generic FastTrack service chart. Owns the shared Kubernetes workload skeleton
  (Deployment, Service, HTTPRoute, KEDA ScaledObject, ServiceAccount/IRSA, CronJob,
  NetworkPolicy) so each service supplies only a thin values.yaml of placeholders.
  Consumed as a Helm *library* by per-service application charts via `{{ include }}`.
version: 1.0.0
