{{/*
ft-service.httproute — Gateway API HTTPRoute (the strategic ingress path).
Double-gated: per-service gatewayApi.enabled AND cluster-level
global.gatewayApi.enabled. Mirrors the existing usage-metrics-api httproute.
*/}}
{{- $ga := (index .Values "gatewayApi") | default dict -}}
{{- $g := (index .Values "global") | default dict -}}
{{- $gg := (index $g "gatewayApi") | default dict -}}
{{- if and $ga.enabled $gg.enabled -}}
{{- $name := include "ft-service.name" . -}}
{{- $env := (index $g "envSettings") | default dict -}}
{{- $target := $env.clusterHostname | default $gg.clusterHostName -}}
{{- $parent := $ga.parentGateway | default dict -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-route
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}
    external-dns: gateway-managed
  annotations:
    {{- with $target }}
    external-dns.alpha.kubernetes.io/target: {{ . }}
    {{- end }}
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: {{ $parent.name | default "main-gateway" }}
      namespace: {{ $parent.namespace | default "gateway" }}
      sectionName: {{ $parent.sectionName | default "https" }}
  {{- with $env.brandHostName }}
  hostnames:
    - "gw-{{ . }}"
    - "api.{{ . }}"
    - "{{ . }}"
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $ga.prefix | default (printf "/%s/" $name) | quote }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ $name }}
          port: {{ $ga.backendPort | default 80 }}
{{- end }}