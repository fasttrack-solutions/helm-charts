{{/*
ft-service.externalsecret — External Secrets Operator ExternalSecret. Pulls a
native K8s Secret out of Vault via a SecretStore. Guarded by
externalSecret.enabled (default false), same safe-access + sync-wave "-1" +
app: label conventions as the sibling secret.yaml / configmap.yaml.

A consumer just gives a LIST OF SECRETS — each entry a secretKey (the key in the
resulting K8s Secret). The Vault path (remoteRef.key) is built as
  <global.clusterName>/<.Release.Namespace>/<serviceName>
e.g. cloudops-sandbox-k8clus/neospin/crm-api. property defaults to the secretKey.
Override with externalSecret.remoteKey (whole ExternalSecret) or a per-item
remoteKey when a secret lives on a different Vault path.
*/}}
{{- $es := (index .Values "externalSecret") | default dict -}}
{{- if $es.enabled -}}
{{- $name := include "ft-service.name" . -}}
{{- $g := (index .Values "global") | default dict -}}
{{- $store := $es.secretStoreRef | default dict -}}
{{- $target := $es.target | default dict -}}
{{- $key := $es.remoteKey | default "" -}}
{{- if not $key -}}
{{- $cluster := $g.clusterName | required "externalSecret: global.clusterName is required to build the Vault path (or set externalSecret.remoteKey)" -}}
{{- $key = printf "%s/%s/%s" (toString $cluster) .Release.Namespace $name -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $store.name | default "vault" }}
    kind: {{ $store.kind | default "SecretStore" }}
  target:
    name: {{ $target.name | default $name }}
    creationPolicy: Owner
    {{- with $target.template }}
    template:
      engine: v2
      {{- toYaml . | nindent 6 }}
    {{- end }}
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .remoteKey | default $key }}
        property: {{ .secretKey }}
    {{- end }}
{{- end -}}
