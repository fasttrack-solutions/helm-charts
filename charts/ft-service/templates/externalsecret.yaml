{{/*
ft-service.externalsecret — External Secrets Operator ExternalSecret. Pulls a
native K8s Secret out of Vault via a SecretStore. Guarded by
externalSecret.enabled (default false), same safe-access + sync-wave "-1" +
app: label conventions as the sibling secret.yaml / configmap.yaml.

A consumer just gives a LIST OF SECRETS — each entry needs a secretKey (the key
in the resulting K8s Secret). The Vault path (remoteRef.key) is built ONCE from
<keyPrefix>/<clusterName>/<brandID>/<serviceName>, so services don't repeat it;
property defaults to the secretKey. Both are per-item overridable when a secret
lives on a different path or under a differently-named Vault field.
*/}}
{{- $es := (index .Values "externalSecret") | default dict -}}
{{- if $es.enabled -}}
{{- $name := include "ft-service.name" . -}}
{{- $g := (index .Values "global") | default dict -}}
{{- $store := $es.secretStoreRef | default dict -}}
{{- $target := $es.target | default dict -}}
{{/* Vault path: explicit externalSecret.remoteKey wins, else built from globals. */}}
{{- $prefix := $es.keyPrefix | default "clusters" -}}
{{- $cluster := $g.clusterName | default "" -}}
{{- $brand := $g.brandID | default "" -}}
{{- $key := $es.remoteKey | default (printf "%s/%s/%s/%s" $prefix (toString $cluster) (toString $brand) $name) -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $store.name | default "vault" }}
    kind: {{ $store.kind | default "SecretStore" }}
  target:
    name: {{ $target.name | default $name }}
    creationPolicy: Owner
    {{- with $target.template }}
    template:
      engine: v2
      {{- toYaml . | nindent 6 }}
    {{- end }}
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .remoteKey | default $key }}
        property: {{ .secretKey }}
    {{- end }}
{{- end -}}