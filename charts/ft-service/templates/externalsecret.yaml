{{/*
ft-service.externalsecret — External Secrets Operator ExternalSecret. Pulls a
native K8s Secret out of Vault via a SecretStore. Guarded by
externalSecret.enabled (default false), same safe-access + sync-wave "-1" +
app: label conventions as the sibling secret.yaml / configmap.yaml.

A consumer gives one Vault path in externalSecret.remoteKey plus a LIST OF
SECRETS — each entry a secretKey (the key in the resulting K8s Secret). The path
is normally templated by the argo-deployments ApplicationSet, e.g.
  remoteKey: "releases/clusters/{{`{{index .path.segments 2}}`}}/{{`{{index .path.segments 3}}`}}/customers.yaml"
property defaults to the secretKey; remoteKey is per-item overridable when a
secret lives on a different Vault path.
*/}}
{{- $es := (index .Values "externalSecret") | default dict -}}
{{- if $es.enabled -}}
{{- $name := include "ft-service.name" . -}}
{{- $store := $es.secretStoreRef | default dict -}}
{{- $target := $es.target | default dict -}}
{{- $key := $es.remoteKey | default "" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $store.name | default "vault" }}
    kind: {{ $store.kind | default "SecretStore" }}
  target:
    name: {{ $target.name | default $name }}
    creationPolicy: Owner
    {{- with $target.template }}
    template:
      engine: v2
      {{- toYaml . | nindent 6 }}
    {{- end }}
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .remoteKey | default $key | required "externalSecret.remoteKey (or a per-item remoteKey) is required when externalSecret.enabled" }}
        property: {{ .secretKey }}
    {{- end }}
{{- end -}}
