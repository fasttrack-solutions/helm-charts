# ft-service library schema defaults.
# All crm-api-specific values (rds, redis, unleash, alertManager, config, etc.)
# live in argo-deployments values files, not here.

deployment:
  image:
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 150Mi
  command:
    - /app/goapp
  ports:
    - name: http
      containerPort: 3000
    - name: debug
      containerPort: 6060
    - name: grpc
      containerPort: 1337
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
  dbInit:
    enabled: true
    env: []

service:
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: grpc
      port: 1337
      targetPort: 1337
  annotations:
    getambassador.io/config: |
      apiVersion: ambassador/v1
      kind: Mapping
      name: crm-api_mapping
      prefix: /crm-api/
      service: crm-api
      timeout_ms: 300000

serviceAccount:
  create: true
  roleArn: ""

scaledObject:
  enabled: false

gatewayApi:
  enabled: false
  parentGateway:
    name: main-gateway
    namespace: gateway
    sectionName: https
