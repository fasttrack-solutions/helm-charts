# Values for the crm-api chart.
# Converted from oneclickdeployment/terraform_v1. AWS resources (IAM role/policy,
# S3 buckets) are NOT part of this chart — they remain managed by Terraform.
#
# ── Library-compatible keys (deployment, service, serviceAccount, scaledObject,
#    gatewayApi, dbInit) feed the ft-service skeleton templates.
# ── crm-api-specific keys (environmentType, brandId, rds, redis, unleash …)
#    feed only configmap.yaml, which stays in this chart.

# -- Namespace override. Defaults to the release namespace when empty.
namespace: ""

# ── crm-api-specific values (used by configmap.yaml) ──────────────────────────

# Environment type: dev | staging | production. Drives config values.
environmentType: production

brandId: ""
brandName: ""
brandHostName: ""

# RDS / MySQL (var.rds_*)
rds:
  host: ""
  masterUsername: ""
  masterPassword: ""

# Redis (var.general_redis_*)
redis:
  host: ""
  port: ""

# CORS: defaults to https://<brandHostName> when empty (was var.api_allowed_origins).
apiAllowedOrigins: ""

# Unleash key resolution (locals.unleash_api_key)
unleash:
  apiKeyOverride: ""
  productionApiKey: ""
  stagingApiKey: ""

# Alert manager implementation (locals.alert_manager_implementation)
alertManager:
  productionImplementation: incident.io
  stagingImplementation: logger

# Rewards backend gRPC key (REWARDS_V3_GRPC_X_API_KEY)
rewards:
  backendGrpcApiKeyOverride: ""

# DEVICE_AUTH_ENABLED: empty -> "false" in production, "true" otherwise
deviceAuthEnabled: ""

# ── ft-service library keys ───────────────────────────────────────────────────

deployment:
  image:
    # was var.image_repository_url
    repository: ""
    # was var.module_version — injected per-deploy by ArgoCD
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      # was var.crm_api_request_{cpu,memory}
      cpu: 25m
      memory: 150Mi
  # arm64 spot pool — set to {workload: common_ondemand} via env values when
  # use_ondemand_instances=true (was var.use_ondemand_instances)
  nodeSelector:
    workload: common
  tolerations:
    - key: arch
      operator: Equal
      value: arm64
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - arm64
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: crm-api
  podLabels:
    spotinst.io/restrict-scale-down: "true"
  ports:
    - { name: http,  containerPort: 3000 }
    - { name: grpc,  containerPort: 1337 }
    - { name: pprof, containerPort: 6060 }
  command:
    - /app/goapp
  prometheus:
    enabled: true
    path: /metrics
    port: 9090
  # replicaCount defaults to 1; set to 2 in the production env-layer values file
  replicaCount: 1

# db-init convenience initContainer — was local.initDbScript + db-init Terraform resource.
# MySQL credentials supplied at the env layer via ArgoCD values (Vault placeholders).
dbInit:
  enabled: true
  image: 745106446559.dkr.ecr.eu-west-1.amazonaws.com/db-init:latest
  env:
    - name: MYSQL_HOST
      value: ""  # set per-env
    - name: MYSQL_USER
      value: ""  # set per-env
    - name: MYSQL_PASSWORD
      value: ""  # set per-env
    - name: MYSQL_PORT
      value: "3306"
    - name: INIT_SQL
      value: "CREATE DATABASE IF NOT EXISTS currency CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

service:
  ports:
    - { name: http, port: 80, targetPort: 3000 }
    - { name: grpc, port: 1337, targetPort: 1337 }
  annotations:
    getambassador.io/config: |
      apiVersion: ambassador/v1
      kind:  Mapping
      name:  crm-api-service_mapping
      prefix: /crm-api/
      service: crm-api
      timeout_ms: 300000

serviceAccount:
  create: true
  # was aws_iam_role.crm-api.arn — set to the IAM role ARN provisioned by Terraform.
  roleArn: ""

# KEDA ScaledObject — was var.use_pod_autoscaling + autoscaling locals.
# minReplicaCount: set to 2 in the production env-layer values file.
scaledObject:
  enabled: false
  pollingInterval: 5
  cooldownPeriod: 300
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metadata:
        type: Utilization
        value: "80"
    - type: memory
      metadata:
        type: Utilization
        value: "90"

# Gateway API HTTPRoute — was var.kubernetes_gateway_api_enabled.
# Hostnames come from global.envSettings.brandHostName (set by the umbrella).
# External-DNS target comes from global.gatewayApi.clusterHostName.
# Double-gated: also requires global.gatewayApi.enabled=true at the cluster layer.
gatewayApi:
  enabled: false
  prefix: /crm-api/

# Prisma migrations Job (managed separately — not yet in ft-service library)
prisma:
  enabled: true
  # was var.prisma_image_repository_url
  imageRepository: ""
  # was var.prisma_module_version
  imageTag: ""
  # was var.use_analytics
  useAnalytics: "false"
