{{- if eq (toString .Values.gatewayApi.enabled) "true" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crm-api-route
  namespace: {{ include "crm-api.namespace" . }}
  labels:
    external-dns: gateway-managed
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ printf "%s.ft-crm.com" (.Values.gatewayApi.sharedClusterName | replace "_" "-") | quote }}
spec:
  parentRefs:
    - name: main-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - {{ printf "gw-%s" .Values.brandHostName | quote }}
    - {{ printf "api.%s" .Values.brandHostName | quote }}
    - {{ .Values.brandHostName | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /crm-api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: crm-api
          port: 80
{{- end }}
